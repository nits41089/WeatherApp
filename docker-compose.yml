version: "3.9"
services:
  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://habit:habit@db:5432/habit_tracker
      - SESSION_SECRET=dev_session_secret
      - COACH_PROVIDER=local
      - ENABLE_OPENAI=false
      - OPENAI_API_KEY=
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=habit
      - POSTGRES_PASSWORD=habit
      - POSTGRES_DB=habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
